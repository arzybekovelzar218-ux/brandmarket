# Render Blueprint for the web frontend (static site).
# If the repo root is not this folder, keep `rootDir` pointing at it.
services:
  - type: web
    name: brandmarket-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://your-backend.onrender.com   # ← your backend URL
    routes:
      - type: rewrite        # SPA: every path serves index.html
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
